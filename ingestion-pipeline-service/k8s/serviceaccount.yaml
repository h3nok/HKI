# Workload Identity binding: GKE pod SA → GCP SA
#
# After applying, run once per environment:
#   gcloud iam service-accounts add-iam-policy-binding \
#     ingestion-pipeline-sa@p-642-cilab-demo.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:p-642-cilab-demo.svc.id.goog[platform/ingestion-pipeline]"
#
# GCP SA needs:
#   roles/storage.objectAdmin        — GCS raw document landing zone
#   roles/pubsub.publisher           — publish ingestion jobs
#   roles/pubsub.subscriber          — pull and ack ingestion jobs
#   roles/aiplatform.user            — Vertex AI LLM contextualization
#   roles/secretmanager.secretAccessor
#   roles/cloudtrace.agent
#   roles/monitoring.metricWriter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion-pipeline
  namespace: platform
  annotations:
    iam.gke.io/gcp-service-account: ingestion-pipeline-sa@p-642-cilab-demo.iam.gserviceaccount.com
