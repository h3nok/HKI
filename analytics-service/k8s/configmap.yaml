apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: platform
data:
  SERVICE_NAME: "analytics-service"
  SERVICE_PORT: "9512"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  # BigQuery — events are exported to BigQuery for durable storage + dashboards
  BQ_DATASET: "analytics"
  BQ_TABLE_EVENTS: "agent_events"

  # Event buffer
  EVENT_BUFFER_MAX: "10000"

  # Downstream services
  ORCHESTRATOR_URL: "http://orchestrator:9501"

  # GCP
  GCP_PROJECT_ID: "p-642-cilab-demo"
  GCP_REGION: "us-central1"

  # Auth
  AUTH_ENABLED: "true"

  # OTel — exports directly to Cloud Trace through the shared tracing module
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_ENDPOINT: ""

  # CORS
  CORS_ORIGINS: '["https://agentic.cilabs.np.hki.com"]'
