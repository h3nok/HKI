apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-bff
  labels:
    app.kubernetes.io/name: agentic-bff
    app.kubernetes.io/part-of: hki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-bff
        app.kubernetes.io/part-of: hki
    spec:
      serviceAccountName: hki-reference-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: hki-reference-agentic-bff
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HKI_SERVICE_NAME
              value: agentic-bff
          envFrom:
            - configMapRef:
                name: hki-reference-config
            - secretRef:
                name: hki-reference-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-bff
  labels:
    app.kubernetes.io/name: agentic-bff
    app.kubernetes.io/part-of: hki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentic-bff
  ports:
    - name: http
      port: 9001
      targetPort: http
      protocol: TCP
---
