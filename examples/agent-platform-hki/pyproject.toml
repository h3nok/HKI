[project]
name = "hki-example-agent-platform"
version = "0.1.0"
description = "HKI + Google Agent Platform (ADK) managed evidence example."
requires-python = ">=3.11"
dependencies = [
    "hki-runtime>=0.1.0",
    "hki-adk>=0.1.0",
]

[project.optional-dependencies]
adk = [
    "google-adk>=0.1.0",
]

[tool.uv.sources]
hki-runtime = { path = "../../packages/hki-runtime-py" }
hki-adk = { path = "../../packages/hki-adk" }
