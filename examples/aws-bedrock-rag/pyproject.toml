[project]
name = "hki-example-aws-bedrock-rag"
version = "0.1.0"
description = "HKI + AWS Bedrock RAG example — domain-scoped retrieval and chat."
requires-python = ">=3.11"
dependencies = [
    "hki-runtime[fastapi]>=0.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
]

[tool.uv.sources]
hki-runtime = { path = "../../packages/hki-runtime-py" }
