<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HKI: Hermetic Knowledge Isolation</title>
  <desc id="desc">A social preview card for Hermetic Knowledge Isolation showing the title, a short description, and three principles: one request, one active domain, no implicit global visibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="55%" stop-color="#ecfeff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1040" cy="120" r="160" fill="#ccfbf1" opacity="0.65" />
  <circle cx="150" cy="560" r="190" fill="#e0e7ff" opacity="0.7" />

  <g filter="url(#shadow)">
    <rect x="66" y="58" width="1068" height="514" rx="28" fill="#ffffff" />
  </g>

  <rect x="66" y="58" width="1068" height="12" rx="6" fill="url(#accent)" />

  <text x="96" y="124" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e" letter-spacing="1.4">ENTERPRISE AI ISOLATION</text>
  <text x="96" y="208" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#0f172a">Hermetic Knowledge</text>
  <text x="96" y="286" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#0f172a">Isolation (HKI)</text>

  <text x="96" y="350" font-family="Charter, Georgia, serif" font-size="29" fill="#334155">A runtime contract for enterprise agentic systems:</text>
  <text x="96" y="392" font-family="Charter, Georgia, serif" font-size="29" fill="#334155">every artifact belongs to one domain, every request runs in one</text>
  <text x="96" y="434" font-family="Charter, Georgia, serif" font-size="29" fill="#334155">active domain, and shared knowledge appears only through</text>
  <text x="96" y="476" font-family="Charter, Georgia, serif" font-size="29" fill="#334155">explicit publication rather than silent global fallback.</text>

  <g>
    <rect x="96" y="514" width="250" height="42" rx="21" fill="#ecfdf5" stroke="#99f6e4" />
    <text x="126" y="541" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115e59">one request</text>

    <rect x="364" y="514" width="280" height="42" rx="21" fill="#eef2ff" stroke="#c7d2fe" />
    <text x="394" y="541" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">one active domain</text>

    <rect x="662" y="514" width="374" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" />
    <text x="692" y="541" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">no implicit global visibility</text>
  </g>

  <text x="952" y="110" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b">Henok Ghebrechristos, PhD</text>
</svg>
