<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 400 400" role="img" aria-label="HKI hermetic monogram" shape-rendering="geometricPrecision">
  <defs>
    <!-- Acrylic teal body for the H -->
    <linearGradient id="acrylicTeal" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%"   stop-color="#67e8d9"/>
      <stop offset="35%"  stop-color="#14b8a6"/>
      <stop offset="75%"  stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f3a3a"/>
    </linearGradient>

    <!-- Acrylic amber body for the K diagonals -->
    <linearGradient id="acrylicAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="35%"  stop-color="#fbbf24"/>
      <stop offset="75%"  stop-color="#E07A1F"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Top edge highlight -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Outer hermetic ring: teal → amber arc -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5eead4"/>
      <stop offset="55%"  stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#E07A1F"/>
    </linearGradient>

    <!-- Active-domain core sigil -->
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#E07A1F"/>
    </radialGradient>

    <!-- H component (teal pillars + crossbar) -->
    <g id="hLetter">
      <rect x="90"  y="90"  width="20" height="220" rx="3"/>
      <rect x="175" y="90"  width="20" height="220" rx="3"/>
      <rect x="110" y="190" width="65" height="20"  rx="3"/>
    </g>

    <!-- K component (amber diagonals; spine is shared H pillar) -->
    <g id="kLetter">
      <g transform="translate(185 200) rotate(-44)">
        <rect x="0" y="-10" width="120" height="20" rx="3"/>
      </g>
      <g transform="translate(185 200) rotate(44)">
        <rect x="0" y="-10" width="120" height="20" rx="3"/>
      </g>
    </g>
  </defs>

  <!-- Hermetic ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <!-- Tick orbit -->
  <circle cx="200" cy="200" r="158" fill="none" stroke="#5eead4" stroke-width="0.8"
          stroke-dasharray="1 8" opacity="0.55"/>

  <!-- ===== H — acrylic teal ===== -->
  <use href="#hLetter" fill="url(#acrylicTeal)"/>
  <use href="#hLetter" fill="none" stroke="#031b1f" stroke-width="1.2"/>
  <use href="#hLetter" fill="url(#edge)"/>

  <!-- ===== K — acrylic amber ===== -->
  <use href="#kLetter" fill="url(#acrylicAmber)"/>
  <use href="#kLetter" fill="none" stroke="#3f1d0a" stroke-width="1.2"/>
  <use href="#kLetter" fill="url(#edge)"/>

  <!-- Active-domain sigil — the i-dot above K -->
  <circle cx="240" cy="62" r="11" fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.7"/>
  <circle cx="240" cy="62" r="6"  fill="url(#core)" stroke="#7c2d12" stroke-width="0.6"/>
</svg>
