<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
  <title id="t">HKI — Hermetic Knowledge Isolation</title>
  <desc id="d">Square newsletter / social cover for HKI.</desc>
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="100%">
      <stop offset="0%" stop-color="#0f3a3a"/>
      <stop offset="55%" stop-color="#0a1f2c"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="55%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#E07A1F"/>
    </linearGradient>
    <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#E07A1F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E7C7B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <g opacity="0.3" stroke="#14b8a6" fill="none">
    <ellipse cx="540" cy="500" rx="500" ry="180" stroke-width="1"/>
    <ellipse cx="540" cy="500" rx="360" ry="120" stroke-width="0.8"/>
  </g>

  <!-- Halo -->
  <circle cx="540" cy="450" r="320" fill="url(#halo)"/>

  <!-- HKI monogram seal -->
  <g transform="translate(340 250)">
    <circle cx="200" cy="200" r="184" fill="none" stroke="url(#brand)" stroke-width="3"/>
    <circle cx="200" cy="200" r="148" fill="none" stroke="url(#brand)" stroke-width="1" stroke-dasharray="3 10" opacity="0.55"/>
    <!-- H -->
    <line x1="110" y1="60"  x2="110" y2="340" stroke="#14b8a6" stroke-width="18" stroke-linecap="round"/>
    <line x1="210" y1="60"  x2="210" y2="340" stroke="#14b8a6" stroke-width="18" stroke-linecap="round"/>
    <line x1="110" y1="200" x2="210" y2="200" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
    <!-- K -->
    <line x1="210" y1="200" x2="310" y2="80"  stroke="#E07A1F" stroke-width="16" stroke-linecap="round"/>
    <line x1="210" y1="200" x2="310" y2="320" stroke="#E07A1F" stroke-width="16" stroke-linecap="round"/>
    <!-- terminals -->
    <circle cx="110" cy="60"  r="13" fill="#14b8a6"/>
    <circle cx="110" cy="340" r="13" fill="#14b8a6"/>
    <circle cx="210" cy="60"  r="13" fill="#14b8a6"/>
    <circle cx="210" cy="340" r="13" fill="#14b8a6"/>
    <circle cx="310" cy="80"  r="12" fill="#E07A1F"/>
    <circle cx="310" cy="320" r="12" fill="#E07A1F"/>
    <!-- I -->
    <circle cx="210" cy="200" r="18" fill="none" stroke="#E07A1F" stroke-width="4"/>
    <circle cx="210" cy="200" r="6"  fill="#E07A1F"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="800" font-size="120" font-weight="800" letter-spacing="-2" fill="#f8fafc">HKI</text>
    <text x="540" y="855" font-size="22" font-weight="700" letter-spacing="6" fill="url(#brandH)">HERMETIC KNOWLEDGE ISOLATION</text>
    <text x="540" y="930" font-family="Charter, Georgia, serif" font-size="26" fill="#cbd5e1">A runtime contract for the agentic era.</text>
  </g>

  <!-- Bottom rule + footer -->
  <line x1="120" y1="990" x2="960" y2="990" stroke="#1e293b" stroke-width="1"/>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">
    <text x="120" y="1024" font-weight="700" fill="#cbd5e1">THE HKI BULLETIN</text>
    <text x="960" y="1024" text-anchor="end">hki.dev · issue 01</text>
  </g>
</svg>
