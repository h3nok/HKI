apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator
  namespace: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale on CPU only — LLM orchestrators have high baseline memory
          # from model loading that is not load-driven, so memory is a poor
          # autoscaling signal for this workload.
          averageUtilization: 65
