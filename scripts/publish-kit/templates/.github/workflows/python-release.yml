name: Python Release

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built distributions"
        required: false
        type: boolean
        default: false
      repository:
        description: "Package index target"
        required: false
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Python Distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install --upgrade uv twine

      - name: Build distributions
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          packages=(
            packages/hki-runtime-py
            packages/hki-conformance-py
            packages/hki-litellm
            packages/hki-langchain
            packages/hki-llamaindex
            packages/hki-adk
            packages/hki-autogen
            packages/hki-crewai
          )
          for package_dir in "${packages[@]}"; do
            echo "==> building ${package_dir}"
            (cd "${package_dir}" && uv build --out-dir "${GITHUB_WORKSPACE}/dist")
          done

      - name: Check distributions
        run: twine check dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: hki-python-distributions
          path: dist/*
          if-no-files-found: error

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
