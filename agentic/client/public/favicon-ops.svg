<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003B75"/>
      <stop offset="100%" stop-color="#002850"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="26" y1="18" x2="74" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0074CC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#005DAA" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bg)"/>
  <!-- Shield body -->
  <path d="M50 16 L76 27 L76 51 C76 68 63 79 50 85 C37 79 24 68 24 51 L24 27 Z"
        fill="url(#shieldFill)" stroke="#0074CC" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- Command bars -->
  <rect x="36" y="40" width="26" height="3" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="36" y="48" width="20" height="3" rx="1.5" fill="white" opacity="0.55"/>
  <rect x="36" y="56" width="14" height="3" rx="1.5" fill="white" opacity="0.35"/>
  <!-- Red signal arcs -->
  <path d="M63 31 Q72 36 72 47" fill="none" stroke="#E31837" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M67 27 Q80 34 80 49" fill="none" stroke="#E31837" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Red status dot -->
  <circle cx="63" cy="31" r="3.5" fill="#E31837"/>
  <circle cx="63" cy="31" r="5.5" fill="none" stroke="#E31837" stroke-width="1.2" opacity="0.35"/>
</svg>
