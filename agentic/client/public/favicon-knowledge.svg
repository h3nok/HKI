<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pg" x1="30" y1="25" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bg)"/>
  <!-- Book spine -->
  <path d="M50 24 L50 76" stroke="url(#pg)" stroke-width="3" stroke-linecap="round"/>
  <!-- Left page -->
  <path d="M50 28 C42 28 28 26 24 24 L24 70 C28 68 42 70 50 72" fill="url(#pg)" opacity="0.9"/>
  <!-- Right page -->
  <path d="M50 28 C58 28 72 26 76 24 L76 70 C72 68 58 70 50 72" fill="url(#pg)" opacity="0.75"/>
  <!-- Page lines (left) -->
  <line x1="32" y1="38" x2="46" y2="40" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="32" y1="46" x2="46" y2="48" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <line x1="32" y1="54" x2="44" y2="56" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  <!-- Page lines (right) -->
  <line x1="54" y1="40" x2="68" y2="38" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="54" y1="48" x2="68" y2="46" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <line x1="54" y1="56" x2="66" y2="54" stroke="#047857" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  <!-- Subtle glow dot -->
  <circle cx="50" cy="30" r="2" fill="white" opacity="0.5"/>
</svg>
