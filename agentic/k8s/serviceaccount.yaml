# Workload Identity binding: GKE pod SA → GCP SA
#
# After applying, run once per environment:
#   gcloud iam service-accounts add-iam-policy-binding \
#     agentic-bff-sa@p-642-cilab-demo.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:p-642-cilab-demo.svc.id.goog[platform/agentic-bff]"
#
# GCP SA needs:
#   roles/cloudsql.client            — Cloud SQL / AlloyDB Auth Proxy (MySQL for BFF DB)
#   roles/secretmanager.secretAccessor
#   roles/cloudtrace.agent
#   roles/monitoring.metricWriter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-bff
  namespace: platform
  annotations:
    iam.gke.io/gcp-service-account: agentic-bff-sa@p-642-cilab-demo.iam.gserviceaccount.com
