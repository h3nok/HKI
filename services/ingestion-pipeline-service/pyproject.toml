[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion-pipeline-service"
version = "0.1.0"
description = "Ingestion Pipeline Service — document processing, chunking, metadata extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.26",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "PyJWT>=2.8.0",
    # GCP adapters
    "redis[hiredis]>=5.0.0",              # Memorystore — job persistence
    "google-cloud-storage>=2.14.0",       # Cloud Storage — document landing zone
    "google-cloud-documentai>=2.20.0",    # Document AI — PDF/image extraction
    "google-cloud-pubsub>=2.23.0",       # Cloud Pub/Sub — durable job queue
    "pypdf>=6.10.2",                      # Local PDF fallback (no Document AI)
    "python-docx>=1.1.0",                  # DOCX text extraction
    "google-genai>=1.0.0",                 # Vertex AI direct (embeddings + LLM)
    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "gunicorn>=22.0.0",
    "hki-shared",
]

[tool.uv.sources]
hki-shared = { path = "../../packages/shared-py", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "httpx",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run coverage explicitly: uv run python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=40

[tool.mypy]
python_version = "3.11"
strict = true
