apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-pipeline
  namespace: platform
  labels:
    app.kubernetes.io/name: ingestion-pipeline
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-pipeline
        app.kubernetes.io/component: service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9508"
    spec:
      serviceAccountName: ingestion-pipeline
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingestion-pipeline
      containers:
        - name: ingestion-pipeline
          image: us-west1-docker.pkg.dev/p-642-cilab-infrastructure/cilab/ingestion-pipeline-service:latest
          ports:
            - name: http
              containerPort: 9508
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ingestion-pipeline-secrets
                  key: LITELLM_API_KEY
          envFrom:
            - configMapRef:
                name: ingestion-pipeline-config
            # Secrets from Secret Manager (external-secrets-operator):
            #   ingestion-pipeline/service-auth-secret    → SERVICE_AUTH_SECRET
            #   ingestion-pipeline/pipeline-write-secret  → KNOWLEDGE_API_PIPELINE_SECRET
            - secretRef:
                name: ingestion-pipeline-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 9508
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9508
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
