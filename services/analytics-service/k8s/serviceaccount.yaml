# Workload Identity binding: GKE pod SA → GCP SA
#
# After applying, run once per environment:
#   gcloud iam service-accounts add-iam-policy-binding \
#     analytics-sa@p-642-cilab-demo.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:p-642-cilab-demo.svc.id.goog[platform/analytics]"
#
# GCP SA needs:
#   roles/bigquery.dataEditor        — write analytics events to BigQuery
#   roles/secretmanager.secretAccessor
#   roles/cloudtrace.agent
#   roles/monitoring.metricWriter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics
  namespace: platform
  annotations:
    iam.gke.io/gcp-service-account: analytics-sa@p-642-cilab-demo.iam.gserviceaccount.com
