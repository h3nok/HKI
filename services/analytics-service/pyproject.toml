[project]
name = "analytics-service"
version = "1.0.0"
description = "Usage analytics and insights"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "google-cloud-bigquery>=3.25.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "PyJWT>=2.8.0",
    "gunicorn>=22.0.0",
    "hki-shared",
    "hki-runtime",
]

[tool.uv.sources]
hki-shared = { path = "../../packages/shared-py", editable = true }
hki-runtime = { path = "../../packages/hki-runtime-py", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run coverage explicitly: uv run python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=40

[tool.mypy]
python_version = "3.12"
strict = true
