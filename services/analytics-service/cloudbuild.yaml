# Build context: apps/ai-platform (repository root for this path is ai-platform/)
# From apps/ai-platform:
#   gcloud builds submit --config=analytics-service/cloudbuild.yaml --project=PROJECT_ID .
#
substitutions:
  _REGION: us-west1
  _REGISTRY: cilab
  _IMAGE: analytics

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/analytics-service/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/p-642-cilab-infrastructure/${_REGISTRY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/p-642-cilab-infrastructure/${_REGISTRY}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/p-642-cilab-infrastructure/${_REGISTRY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/p-642-cilab-infrastructure/${_REGISTRY}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
