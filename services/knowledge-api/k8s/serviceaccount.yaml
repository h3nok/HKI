# Workload Identity binding: GKE pod SA → GCP SA
#
# After applying, run once per environment:
#   gcloud iam service-accounts add-iam-policy-binding \
#     knowledge-api-sa@p-642-cilab-demo.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:p-642-cilab-demo.svc.id.goog[platform/knowledge-api]"
#
# GCP SA needs:
#   roles/alloydb.client             — AlloyDB Auth Proxy connection
#   roles/aiplatform.user            — Vertex AI embedding calls
#   roles/secretmanager.secretAccessor
#   roles/cloudtrace.agent
#   roles/monitoring.metricWriter
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledge-api
  namespace: platform
  annotations:
    iam.gke.io/gcp-service-account: knowledge-api-sa@p-642-cilab-demo.iam.gserviceaccount.com
