[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-api"
version = "0.1.0"
description = "Knowledge Platform — hybrid vector + keyword search with citation extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "httpx==0.28.1",
    "python-json-logger==4.0.0",
    "redis==7.2.1",
    "PyJWT==2.12.0",
    "asyncpg==0.31.0",
    "pgvector==0.4.2",
    "neo4j==6.1.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-gcp-trace==1.11.0",
    "opentelemetry-instrumentation-fastapi==0.60b1",
    "opentelemetry-instrumentation-httpx==0.60b1",
    "mcp[cli]==1.26.0",
    "starlette==0.52.1",
    "google-cloud-aiplatform[evaluation]>=1.87.0",
    "pandas>=2.0.0",
    "hki-shared",
]

[tool.uv.sources]
hki-shared = { path = "../../packages/shared-py", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "httpx",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run coverage explicitly: uv run python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=40

[tool.mypy]
python_version = "3.11"
strict = true
