[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-service"
version = "0.1.0"
description = "Consolidated Agent Orchestration Service — supervisor, router, and worker agents in-process"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "litellm>=1.83.0",
    "python-json-logger>=2.0.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "mcp>=1.0.0",
    "google-adk>=1.28.1",
    "hki-shared",
]

[tool.uv.sources]
hki-shared = { path = "../../packages/shared-py", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "httpx",  # for TestClient
]
agent-engine = [
    # Vertex AI Agent Engine (Reasoning Engine) hosting — optional so the
    # service image stays lean. Install when deploying to Agent Engine:
    #   pip install 'orchestrator-service[agent-engine]'
    "google-cloud-aiplatform[agent_engines]>=1.112",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run coverage explicitly: uv run python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=40

[tool.mypy]
python_version = "3.11"
strict = true
