# Workload Identity binding: GKE pod SA → GCP SA
#
# After applying, run once per environment:
#   gcloud iam service-accounts add-iam-policy-binding \
#     orchestrator-sa@p-642-cilab-demo.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:p-642-cilab-demo.svc.id.goog[platform/orchestrator]"
#
# GCP SA needs:
#   roles/aiplatform.user          — Vertex AI model calls (ADK agent)
#   roles/secretmanager.secretAccessor — pull secrets at startup
#   roles/cloudtrace.agent         — write Cloud Trace spans
#   roles/monitoring.metricWriter  — write custom metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: platform
  annotations:
    iam.gke.io/gcp-service-account: orchestrator-sa@p-642-cilab-demo.iam.gserviceaccount.com
