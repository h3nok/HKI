apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: platform
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/component: service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9501"
    spec:
      serviceAccountName: orchestrator
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orchestrator
      containers:
        - name: orchestrator
          image: us-west1-docker.pkg.dev/p-642-cilab-infrastructure/cilab/orchestrator-service:latest
          ports:
            - name: http
              containerPort: 9501
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: LITELLM_API_KEY
          envFrom:
            - configMapRef:
                name: orchestrator-config
            # Secrets from Secret Manager (external-secrets-operator):
            #   orchestrator/service-auth-secret  → SERVICE_AUTH_SECRET
            #   orchestrator/llm-api-key          → LLM_API_KEY
            - secretRef:
                name: orchestrator-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
