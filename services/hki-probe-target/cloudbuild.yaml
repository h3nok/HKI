steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - services/hki-probe-target/Dockerfile
      - -t
      - ${_IMAGE}
      - .

  - name: "gcr.io/cloud-builders/docker"
    args: [push, "${_IMAGE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hki-probe-target
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --max-instances=3
      - --memory=256Mi
      - --cpu=1
      - --timeout=30s

substitutions:
  _IMAGE: gcr.io/${PROJECT_ID}/hki-probe-target:${SHORT_SHA}
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
