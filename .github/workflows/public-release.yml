name: Public Release Preview

on:
  pull_request:
    paths:
      - ".github/workflows/public-release.yml"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "scripts/audit-public-release.mjs"
      - "scripts/audit-hki-conformance.mjs"
      - "scripts/build-conformance-registry.mjs"
      - "scripts/ensure-package-built.mjs"
      - "scripts/fix-formatter-mangling.py"
      - "scripts/hki-ast-audit-ts.mjs"
      - "scripts/hki_ast_audit.py"
      - "scripts/publish-kit/**"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-release.yml"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "scripts/audit-public-release.mjs"
      - "scripts/audit-hki-conformance.mjs"
      - "scripts/build-conformance-registry.mjs"
      - "scripts/ensure-package-built.mjs"
      - "scripts/fix-formatter-mangling.py"
      - "scripts/hki-ast-audit-ts.mjs"
      - "scripts/hki_ast_audit.py"
      - "scripts/publish-kit/**"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      push_public_branch:
        description: "Push generated public repo to a review branch"
        required: false
        type: boolean
        default: false
      public_remote:
        description: "Public repository SSH remote"
        required: false
        type: string
        default: "git@github.com:open-hki/hki.git"
      public_branch:
        description: "Review branch name; empty uses public-release-<sha>"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preview:
    name: Materialize and Validate Public Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install source workspace
        run: pnpm install --frozen-lockfile

      - name: Check public audit syntax
        run: node --check scripts/audit-public-release.mjs

      - name: Render reference Kubernetes starter
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl kustomize examples/reference-k8s > /tmp/hki-reference-k8s.yaml
          else
            echo "kubectl not available; skipping render check on this runner"
          fi

      - name: Materialize public repo
        run: ./scripts/publish-kit/publish-hki-public.sh --out /tmp/open-hki-public

      - name: Install generated public repo
        working-directory: /tmp/open-hki-public
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit generated public repo
        working-directory: /tmp/open-hki-public
        run: pnpm audit:public-release

      - name: Build generated TypeScript packages
        working-directory: /tmp/open-hki-public
        run: |
          pnpm build:hki-runtime
          pnpm build:hki-conformance
          pnpm build:hki-mcp
          pnpm build:hki-sdk

      - name: Verify generated conformance suite
        working-directory: /tmp/open-hki-public
        run: pnpm verify:hki-conformance

      - name: Build generated evidence registry
        working-directory: /tmp/open-hki-public
        run: pnpm registry:build

      - name: Run generated demo
        working-directory: /tmp/open-hki-public
        run: pnpm demo:hki

      - name: Upload generated public repo
        uses: actions/upload-artifact@v4
        with:
          name: open-hki-public-repo
          path: /tmp/open-hki-public
          if-no-files-found: error

      - name: Upload generated evidence registry
        uses: actions/upload-artifact@v4
        with:
          name: open-hki-conformance-registry
          path: /tmp/open-hki-public/conformance.json
          if-no-files-found: error

      - name: Upload rendered reference Kubernetes starter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hki-reference-k8s-rendered
          path: /tmp/hki-reference-k8s.yaml
          if-no-files-found: warn

  publish-review-branch:
    name: Push Public Review Branch
    runs-on: ubuntu-latest
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_public_branch == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure SSH deploy key
        env:
          OPEN_HKI_DEPLOY_KEY: ${{ secrets.OPEN_HKI_DEPLOY_KEY }}
        run: |
          if [[ -z "${OPEN_HKI_DEPLOY_KEY}" ]]; then
            echo "::error::OPEN_HKI_DEPLOY_KEY is required to push the public repo"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${OPEN_HKI_DEPLOY_KEY}"
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push generated public repo branch
        env:
          PUBLIC_REMOTE: ${{ inputs.public_remote }}
          PUBLIC_BRANCH: ${{ inputs.public_branch }}
        run: |
          branch="${PUBLIC_BRANCH}"
          if [[ -z "${branch}" ]]; then
            branch="public-release-${GITHUB_SHA::8}"
          fi
          ./scripts/publish-kit/publish-hki-public.sh \
            --out /tmp/open-hki-public-publish \
            --branch "${branch}" \
            --message "chore: publish HKI public release ${GITHUB_SHA::8}" \
            --push "${PUBLIC_REMOTE}"
