name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck:hki-runtime
      - run: pnpm typecheck:hki-conformance
      - run: pnpm typecheck:hki-mcp
      - run: pnpm --dir packages/ui typecheck
      - run: pnpm --dir apps/agentic check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:hki-runtime
      - run: pnpm test:hki-conformance
      - run: pnpm test:hki-mcp

  conformance:
    name: HKI Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit:ui-tokens
      - run: pnpm audit:hki
      - run: pnpm audit:hki-ast-ts
      - run: pnpm verify:hki-conformance
      - run: pnpm probe:smoke

  hki-python:
    name: HKI Python Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - run: pnpm install --frozen-lockfile

      - name: Sync hki-runtime-py (with dev extras)
        run: cd packages/hki-runtime-py && uv sync --extra dev

      - name: Sync hki-conformance-py (with dev extras)
        run: cd packages/hki-conformance-py && uv sync --extra dev

      - run: pnpm test:hki-runtime-py
      - run: pnpm test:hki-litellm
      - run: pnpm test:hki-langchain
      - run: pnpm test:hki-llamaindex
      - run: pnpm test:hki-adk
      - run: pnpm test:hki-autogen
      - run: pnpm test:hki-crewai
      - run: pnpm test:hki-integration
      - run: pnpm test:hki-threats
      - run: pnpm test:hki-conformance-py
      - run: pnpm verify:hki-conformance-py
      - run: pnpm audit:hki-ast

      - name: Build evidence registry
        run: pnpm registry:build

      - name: Upload conformance.json
        uses: actions/upload-artifact@v4
        with:
          name: hki-conformance-registry
          path: conformance.json
          if-no-files-found: error

  probe-smoke:
    name: L4 Probe Smoke (mock gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build runtime + conformance
        run: pnpm build:hki-runtime && pnpm build:hki-conformance

      - name: Run hki-probe against mock gateway (P01–P10)
        run: pnpm --dir packages/hki-conformance probe:smoke

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hki-probe-evidence
          path: /tmp/hki-evidence.json
          if-no-files-found: warn

  service-evidence:
    name: Service HKI Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local service tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof
          pip install --upgrade uv

      - name: Bootstrap Python services
        run: make bootstrap

      - name: Run strict-auth service evidence
        run: make hki-service-evidence-auth

      - name: Upload service evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hki-service-evidence
          path: artifacts/hki/service-evidence.auth.json
          if-no-files-found: warn

  hki-gate:
    name: HKI Gate (required)
    runs-on: ubuntu-latest
    needs:
      - quality
      - typecheck
      - test
      - conformance
      - hki-python
      - probe-smoke
      - service-evidence
    if: always()
    steps:
      - name: Verify all HKI gates passed
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.conformance.result }}" != "success" ] \
            || [ "${{ needs.hki-python.result }}" != "success" ] \
            || [ "${{ needs.probe-smoke.result }}" != "success" ] \
            || [ "${{ needs.service-evidence.result }}" != "success" ]; then
            echo "::error::One or more HKI gates failed"
            exit 1
          fi
          echo "All HKI gates green."
