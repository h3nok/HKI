[project]
name = "hki-integration-tests"
version = "0.1.0"
description = "Cross-adapter end-to-end integration tests. Imports all 6 HKI adapter packages in one process and asserts they enforce the same invariants on the same envelope. This is the canonical 'they actually compose' proof for the HKI reference implementation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HKI Contributors" }]

dependencies = [
    "hki-runtime>=0.1.0",
    "hki-langchain>=0.1.0",
    "hki-litellm>=0.1.0",
    "hki-llamaindex>=0.1.0",
    "hki-adk>=0.1.0",
    "hki-autogen>=0.1.0",
    "hki-crewai>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hki_integration_tests"]

[tool.uv.sources]
hki-runtime = { path = "../hki-runtime-py" }
hki-langchain = { path = "../hki-langchain" }
hki-litellm = { path = "../hki-litellm" }
hki-llamaindex = { path = "../hki-llamaindex" }
hki-adk = { path = "../hki-adk" }
hki-autogen = { path = "../hki-autogen" }
hki-crewai = { path = "../hki-crewai" }

[tool.pytest.ini_options]
testpaths = ["tests"]
