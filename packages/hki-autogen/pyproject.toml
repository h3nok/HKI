[project]
name = "hki-autogen"
version = "0.1.0"
description = "HKI (Hermetic Knowledge Isolation) integration for Microsoft AutoGen — message guards, tool wrappers, and cache-key helpers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HKI Contributors" }]
keywords = ["agentic-ai", "ai-governance", "autogen", "hki", "isolation", "microsoft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["hki-runtime>=0.1.0"]

[project.optional-dependencies]
autogen = ["autogen-core>=0.4", "autogen-agentchat>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hki_autogen"]

[tool.uv.sources]
hki-runtime = { path = "../hki-runtime-py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
