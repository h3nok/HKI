[project]
name = "hki-runtime"
version = "0.1.0"
description = "Hermetic Knowledge Isolation runtime envelope, cache, gateway, and telemetry helpers for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HKI Contributors" }]
keywords = [
    "agent-security",
    "agentic-ai",
    "ai-governance",
    "conformance",
    "hki",
    "isolation",
    "mcp",
    "rag",
    "zero-trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = [
    "starlette>=0.37",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "starlette>=0.37",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hki_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
