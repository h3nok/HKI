[project]
name = "hki-conformance"
version = "0.1.0"
description = "Hermetic Knowledge Isolation conformance fixtures, adapter protocol, and certification runner for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HKI Contributors" }]
keywords = [
    "agent-security",
    "agentic-ai",
    "ai-governance",
    "certification",
    "conformance",
    "hki",
    "isolation",
    "mcp",
    "zero-trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["hki-runtime>=0.1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
hki-conformance = "hki_conformance.cli:main"

[project.urls]
Homepage = "https://github.com/h3nok/HKI"
Repository = "https://github.com/h3nok/HKI"
Issues = "https://github.com/h3nok/HKI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hki-runtime = { path = "../hki-runtime-py" }

[tool.hatch.build.targets.wheel]
packages = ["hki_conformance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
