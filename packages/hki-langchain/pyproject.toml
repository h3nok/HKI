[project]
name = "hki-langchain"
version = "0.1.0"
description = "HKI (Hermetic Knowledge Isolation) integration for LangChain and LangGraph — callback handler, retriever wrapper, and cache-key helpers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HKI Contributors" }]
keywords = ["agentic-ai", "ai-governance", "hki", "isolation", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["hki-runtime>=0.1.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hki_langchain"]

[tool.uv.sources]
hki-runtime = { path = "../hki-runtime-py" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
